[project]
name = "gpt-spine-mcp"
version = "0.7.1"
description = "OpenAI/Codex MCP workflow for production Spine 2D rigs and animation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Egor Fedorov" }, { name = "GPT Spine MCP contributors" }]
keywords = ["mcp", "spine", "spine2d", "animation", "rigging", "gamedev"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  "mcp[cli]>=1.2,<2",
  "pillow>=10",
  "psd-tools[composite]>=1.9",
]

[project.urls]
Homepage = "https://github.com/kumikilongyeyo/gpt-spine-mcp"
Repository = "https://github.com/kumikilongyeyo/gpt-spine-mcp"
Upstream = "https://github.com/egorfedorov/spine-mcp"

[project.scripts]
gpt-spine-mcp = "server:main"
gpt-spine = "gpt_spine:main"
spine-mcp = "server:main"

[project.optional-dependencies]
agents = ["openai-agents>=0.4,<1"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
  "server.py", "spine_cli.py", "spine_rig.py", "spine_preview.py",
  "spine_validate.py", "spine_quality.py", "spine_motion.py", "spine_fx.py",
  "spine_spec.py", "spine_brain.py", "spine_smart_rig.py", "workflow.py",
  "gpt_spine.py", "openai_agent.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
