[project]
name = "spine-mcp"
version = "0.1.0"
description = "MCP server that rigs and animates Spine 2D skeletons from cut-up character art"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Egor Fedorov" }]
keywords = ["mcp", "spine", "spine2d", "animation", "rigging", "gamedev"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  # Upper bound, and it is load-bearing. mcp 2.0 removed mcp.server.fastmcp,
  # which is the import this server is built on. An open ">=1.2" resolved to
  # 1.27 on the machine this was written on and to 2.0 on a fresh install, so
  # the package worked for its author and crashed on import for everybody else.
  "mcp[cli]>=1.2,<2",
  "pillow>=10",
  "psd-tools>=1.9",
]

[project.urls]
Homepage = "https://github.com/egorfedorov/spine-mcp"

# The entry point is what makes `uvx --from git+https://... spine-mcp` work, and
# what the mozg plugin launches. Without it the server can only be started by
# pointing an interpreter at a file on a path only its author has.
[project.scripts]
spine-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: four modules that import each other by name.
include = ["server.py", "spine_cli.py", "spine_rig.py", "spine_preview.py"]
